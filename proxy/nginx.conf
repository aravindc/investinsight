# Single entry point for the stack: /api -> middleware, everything else -> frontend.

# Re-resolve the containers' names through Docker's DNS instead of once at
# startup: a rebuilt container gets a new IP, and a startup-time lookup
# kept proxying to the old one (502 until the proxy restarted).
upstream middleware {
    zone middleware 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server investinsight-middleware:3000 resolve;
}

upstream frontend {
    zone frontend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server investinsight-frontend:80 resolve;
}

server {
    listen 80;
    server_name _;

    # CSV uploads go through /api/csv-upload.
    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://middleware;
        # Market-price and logo backfills can run for several minutes.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend;
    }
}
