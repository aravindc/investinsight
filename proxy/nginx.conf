# Single entry point for the stack: /api -> middleware, everything else -> frontend.

upstream middleware {
    server investinsight-middleware:3000;
}

upstream frontend {
    server investinsight-frontend:80;
}

server {
    listen 80;
    server_name _;

    # CSV uploads go through /api/csv-upload.
    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://middleware;
        # Market-price and logo backfills can run for several minutes.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend;
    }
}
