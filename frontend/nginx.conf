# Serves the built SPA only; /api is routed to the middleware by investinsight-proxy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change; cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing (react-router): fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
