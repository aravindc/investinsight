server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSV uploads go through /api/csv-upload.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://middleware:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Market-price and logo backfills can run for several minutes.
        proxy_read_timeout 300s;
    }

    # Hashed build assets never change; cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing (react-router): fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
