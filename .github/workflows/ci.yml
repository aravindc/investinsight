name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: CI checks code, it never writes to the repo.
permissions:
  contents: read

# A new push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  middleware:
    name: Middleware (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: middleware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: middleware/go.mod
          cache-dependency-path: middleware/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      # gbx2gbp is a separate module: a one-off CSV conversion tool.
      - name: Vet and build gbx2gbp
        working-directory: gbx2gbp
        run: |
          go vet ./...
          go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the frontend Dockerfile's node:22 build image.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Runs tsc -b (type check) before vite build.
      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build middleware image
        run: docker build -t investinsight-middleware:ci middleware

      - name: Build frontend image
        run: docker build -t investinsight-frontend:ci frontend
