services:
  investinsight-db:
    image: postgres:18-alpine
    container_name: investinsight-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Ports completely removed. Strictly internal Docker network communication only.
    ports:
      - 5888:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  investinsight-middleware:
    build: ./middleware
    container_name: investinsight-middleware
    restart: always
    environment:
      APP_PORT: 3000
      DB_HOST: investinsight-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSLMODE: disable
      LOGO_DEV_API_KEY: ${LOGO_DEV_API_KEY:-}
      # Origin the app is served from via investinsight-proxy.
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    # No published port: reached only via investinsight-proxy.
    depends_on:
      investinsight-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/healthz",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  investinsight-frontend:
    build: ./frontend
    container_name: investinsight-frontend
    restart: always
    # No published port: reached only via investinsight-proxy.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3

  investinsight-proxy:
    image: nginx:1.29-alpine
    container_name: investinsight-proxy
    restart: always
    ports:
      - 8080:80
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      investinsight-middleware:
        condition: service_healthy
      investinsight-frontend:
        condition: service_healthy

volumes:
  postgres_data:
