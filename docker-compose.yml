services:
  db:
    image: postgres:18-alpine
    container_name: investinsight-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Ports completely removed. Strictly internal Docker network communication only.
    ports:
      - 5888:5432
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
